<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sonativa — Project</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(
circle at 50% -10%,
#172033 0%,
#06080d 45%,
#040509 100%
);
color:#fff;
min-height:100vh;
}

.container{
width:92%;
max-width:1000px;
margin:auto;
}

header{
border-bottom:1px solid #202633;
background:rgba(5,7,12,.9);
}

.nav{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:23px;
font-weight:900;
letter-spacing:3px;
}

.back{
padding:10px 15px;
border:1px solid #303847;
border-radius:9px;
background:#10151e;
color:#fff;
text-decoration:none;
}

main{
padding:60px 0;
}

.hero{
text-align:center;
margin-bottom:40px;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
color:#818b9c;
}

.status{
display:inline-block;
margin-top:15px;
padding:6px 12px;
border-radius:20px;
background:#151a24;
border:1px solid #303847;
color:#9ca6b7;
font-size:12px;
}

.grid{
display:grid;
grid-template-columns:repeat(
auto-fit,
minmax(280px,1fr)
);
gap:18px;
}

.card{
background:rgba(12,16,23,.92);
border:1px solid #252d3b;
border-radius:16px;
padding:25px;
}

.card h2{
font-size:19px;
margin-bottom:20px;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:13px 0;
border-bottom:1px solid #202733;
}

.label{
color:#707b8e;
font-size:13px;
}

.value{
text-align:right;
word-break:break-word;
font-size:14px;
max-width:65%;
}

.description{
grid-column:1/-1;
}

.description-text{
color:#aeb7c6;
line-height:1.7;
white-space:pre-wrap;
word-break:break-word;
}

.tokenomics{
grid-column:1/-1;
}

.tokenomics-grid{
display:grid;
grid-template-columns:repeat(
auto-fit,
minmax(220px,1fr)
);
gap:12px;
}

.tokenomics-item{
padding:16px;
background:#080b12;
border:1px solid #252d3b;
border-radius:10px;
}

.tokenomics-item span{
display:block;
color:#707b8e;
font-size:12px;
margin-bottom:6px;
}

.tokenomics-item strong{
font-size:18px;
}

.loading,
.error{
text-align:center;
padding:40px;
color:#818b9c;
}

.error{
color:#ff8f8f;
}

.actions{
margin-top:30px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.button{
display:inline-block;
padding:13px 20px;
border-radius:9px;
font-weight:bold;
text-decoration:none;
border:1px solid #303847;
background:#10151e;
color:#fff;
}

.primary{
background:#fff;
color:#06080d;
}

footer{
text-align:center;
padding:45px 0;
color:#697386;
font-size:13px;
}

@media(max-width:600px){

.hero h1{
font-size:32px;
}

.row{
align-items:flex-start;
}

.value{
max-width:60%;
}

}

</style>

</head>

<body>

<header>

<div class="container nav">

<div class="logo">
SONATIVA
</div>

<a
class="back"
href="projects.html">

← My Projects

</a>

</div>

</header>


<main>

<div class="container">

<section class="hero">

<h1 id="projectTitle">
Loading...
</h1>

<p id="projectSubtitle">
Loading project information...
</p>

<div
class="status"
id="projectStatus">

Loading

</div>

</section>


<div id="content">

<div class="loading">
Loading your project...
</div>

</div>

</div>

</main>


<footer>
© 2026 Sonativa
</footer>


<script type="module">

/* =========================================
   SUPABASE
========================================= */

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://kallobeodjzzhrsaqszw.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_JH5v7Fix_d6HsHcRX2_vmw_wRVNLOkX";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   HELPERS
========================================= */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
   BIG NUMBER FORMAT
========================================= */

function formatBigNumber(value){

if(
value === null ||
value === undefined ||
value === ""
){

return "-";

}

try{

const number =
BigInt(String(value));

return number.toLocaleString(
"en-US"
);

}catch{

return escapeHtml(value);

}

}


/* =========================================
   DATE
========================================= */

function formatDate(value){

if(!value){

return "-";

}

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
){

return "-";

}

return date.toLocaleString();

}


/* =========================================
   TOKENOMICS PARSER
========================================= */

function parseTokenomics(description){

if(!description){

return null;

}

const marker =
"--- SONATIVA TOKENOMICS ---";

if(
!description.includes(marker)
){

return null;

}

const section =
description
.split(marker)[1]
.trim();


const result = {};


const lines =
section.split(/\r?\n/);


lines.forEach(
function(line){

const match =
line.match(
/^([^:]+):\s*([\d.]+)%$/
);

if(!match){

return;

}

const key =
match[1]
.trim()
.toLowerCase()
.replace(/\s+/g,"_");


const value =
match[2];


result[key] =
value + "%";

});

return result;

}


/* =========================================
   GET PROJECT ID
========================================= */

const params =
new URLSearchParams(
window.location.search
);

const projectId =
params.get("id");


/* =========================================
   LOAD PROJECT
========================================= */

async function loadProject(){

const content =
document.getElementById(
"content"
);


/* =========================================
   NO ID
========================================= */

if(!projectId){

content.innerHTML = `

<div class="error">

<h2>
No project selected
</h2>

<br>

<a
class="button primary"
href="projects.html">

← Back to My Projects

</a>

</div>

`;

return;

}


/* =========================================
   USER
========================================= */

const {
data:{
user
},
error:userError
} =
await supabase.auth.getUser();


if(userError){

content.innerHTML = `

<div class="error">

<h2>
Unable to verify account
</h2>

<br>

${escapeHtml(
userError.message
)}

</div>

`;

return;

}


if(!user){

content.innerHTML = `

<div class="error">

<h2>
You must login first
</h2>

<br>

<a
class="button primary"
href="index.html">

Login

</a>

</div>

`;

return;

}


/* =========================================
   GET PROJECT
========================================= */

const {
data:project,
error
} =
await supabase

.from("projects")

.select(`
Id,
created_at,
user_id,
project_name,
token_name,
token_symbol,
total_supply,
network,
description
`)

.eq(
"Id",
projectId
)

.eq(
"user_id",
user.id
)

.single();


/* =========================================
   DATABASE ERROR
========================================= */

if(error){

console.error(
"Project error:",
error
);

content.innerHTML = `

<div class="error">

<h2>
Project not found
</h2>

<br>

${escapeHtml(
error.message
)}

<br><br>

<a
class="button primary"
href="projects.html">

← Back to My Projects

</a>

</div>

`;

return;

}


/* =========================================
   HEADER
========================================= */

document.getElementById(
"projectTitle"
).textContent =
project.project_name ||
"Unnamed Project";


document.getElementById(
"projectSubtitle"
).textContent =
project.token_name ||
"Sonativa Project";


document.getElementById(
"projectStatus"
).textContent =
"Project Saved";


/* =========================================
   TOKENOMICS
========================================= */

const tokenomics =
parseTokenomics(
project.description
);


/* =========================================
   TOKENOMICS HTML
========================================= */

let tokenomicsHTML = "";


if(tokenomics){

tokenomicsHTML = `

<div class="card tokenomics">

<h2>
Tokenomics
</h2>

<div class="tokenomics-grid">

<div class="tokenomics-item">
<span>TEAM</span>
<strong>
${escapeHtml(
tokenomics.team || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>TREASURY</span>
<strong>
${escapeHtml(
tokenomics.treasury || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>COMMUNITY</span>
<strong>
${escapeHtml(
tokenomics.community || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>PUBLIC SALE</span>
<strong>
${escapeHtml(
tokenomics.public_sale || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>LIQUIDITY</span>
<strong>
${escapeHtml(
tokenomics.liquidity || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>BURN RESERVE</span>
<strong>
${escapeHtml(
tokenomics.burn_reserve || "0%"
)}
</strong>
</div>

</div>

</div>

`;

}


/* =========================================
   DISPLAY PROJECT
========================================= */

content.innerHTML = `

<div class="grid">


<div class="card">

<h2>
Project Information
</h2>


<div class="row">

<span class="label">
Project Name
</span>

<span class="value">
${escapeHtml(
project.project_name ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Network
</span>

<span class="value">
${escapeHtml(
project.network ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Created
</span>

<span class="value">
${formatDate(
project.created_at
)}
</span>

</div>

</div>


<div class="card">

<h2>
Token Information
</h2>


<div class="row">

<span class="label">
Token Name
</span>

<span class="value">
${escapeHtml(
project.token_name ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Token Symbol
</span>

<span class="value">
${escapeHtml(
project.token_symbol ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Total Supply
</span>

<span class="value">
${formatBigNumber(
project.total_supply
)}
</span>

</div>

</div>


${tokenomicsHTML}


<div class="card description">

<h2>
Project Description
</h2>

<div class="description-text">
${escapeHtml(
project.description ||
"No description provided."
)}
</div>

</div>


</div>


<div class="actions">

<a
class="button primary"
href="projects.html">

← My Projects

</a>


<a
class="button"
href="token-studio.html">

Create Another Project

</a>


<a
class="button"
href="tokenomics-studio.html?id=${encodeURIComponent(project.Id)}">

Edit Tokenomics

</a>

</div>

`;

}


/* =========================================
   START
========================================= */

loadProject();

</script>

</body>

</html>
