<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project — Sonativa</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(
circle at 50% -10%,
#172033 0%,
#06080d 45%,
#040509 100%
);
color:#fff;
min-height:100vh;
}

.container{
width:92%;
max-width:1000px;
margin:auto;
}

header{
border-bottom:1px solid #202633;
background:rgba(5,7,12,.92);
backdrop-filter:blur(10px);
}

.nav{
min-height:72px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:23px;
font-weight:900;
letter-spacing:3px;
}

.back{
padding:10px 15px;
border:1px solid #303847;
border-radius:9px;
background:#10151e;
color:#fff;
text-decoration:none;
transition:.2s;
}

.back:hover{
background:#171d28;
border-color:#4a5569;
}

main{
padding:55px 0;
}

.hero{
text-align:center;
margin-bottom:35px;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
word-break:break-word;
}

.hero p{
color:#818b9c;
font-size:15px;
word-break:break-word;
}

.status{
display:inline-flex;
align-items:center;
gap:7px;
margin-top:15px;
padding:7px 13px;
border-radius:20px;
background:#151a24;
border:1px solid #303847;
color:#9ca6b7;
font-size:12px;
}

.status-dot{
width:7px;
height:7px;
border-radius:50%;
background:#8b95a7;
}

.status.created{
color:#8ee6b0;
border-color:#315c45;
}

.status.created .status-dot{
background:#57d88b;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(290px,1fr));
gap:18px;
}

.card{
background:rgba(12,16,23,.94);
border:1px solid #252d3b;
border-radius:16px;
padding:25px;
box-shadow:
0 12px 40px rgba(0,0,0,.15);
}

.card h2{
font-size:19px;
margin-bottom:20px;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
padding:13px 0;
border-bottom:1px solid #202733;
}

.row:last-child{
border-bottom:0;
}

.label{
color:#707b8e;
font-size:13px;
flex-shrink:0;
}

.value{
text-align:right;
word-break:break-word;
font-size:14px;
max-width:68%;
}

.description{
grid-column:1/-1;
}

.description-text{
color:#aeb7c6;
line-height:1.7;
white-space:pre-wrap;
word-break:break-word;
}

.tokenomics{
grid-column:1/-1;
}

.tokenomics-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:12px;
}

.tokenomics-item{
padding:16px;
background:#080b12;
border:1px solid #252d3b;
border-radius:10px;
}

.tokenomics-item span{
display:block;
color:#707b8e;
font-size:12px;
margin-bottom:6px;
}

.tokenomics-item strong{
font-size:18px;
}

.onchain{
grid-column:1/-1;
}

.address-box{
margin-top:12px;
padding:15px;
background:#080b12;
border:1px solid #252d3b;
border-radius:10px;
}

.address-label{
color:#707b8e;
font-size:12px;
margin-bottom:8px;
}

.address{
font-family:
ui-monospace,
SFMono-Regular,
Menlo,
Monaco,
Consolas,
monospace;
font-size:12px;
line-height:1.6;
word-break:break-all;
color:#aeb7c6;
}

.address-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.small-button{
padding:9px 12px;
border-radius:8px;
border:1px solid #303847;
background:#10151e;
color:#fff;
cursor:pointer;
font-size:12px;
text-decoration:none;
}

.small-button:hover{
background:#171d28;
}

.small-button.primary{
background:#fff;
color:#06080d;
border-color:#fff;
}

.actions{
margin-top:30px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.button{
display:inline-block;
padding:13px 20px;
border-radius:9px;
font-weight:bold;
text-decoration:none;
border:1px solid #303847;
background:#10151e;
color:#fff;
cursor:pointer;
}

.button:hover{
background:#171d28;
}

.primary{
background:#fff;
color:#06080d;
border-color:#fff;
}

.loading,
.error,
.empty{
text-align:center;
padding:45px 20px;
color:#818b9c;
}

.error{
color:#ff8f8f;
}

.error-box{
background:#120c0c;
border:1px solid #633737;
border-radius:14px;
padding:25px;
}

.empty-box{
background:#0d1119;
border:1px solid #252d3b;
border-radius:16px;
padding:35px 20px;
}

.empty-box h2{
color:#fff;
margin-bottom:10px;
}

.empty-box p{
color:#818b9c;
margin-bottom:20px;
}

.copy-success{
color:#8ee6b0 !important;
}

footer{
text-align:center;
padding:45px 0;
color:#697386;
font-size:13px;
}

.hidden{
display:none !important;
}

@media(max-width:600px){

main{
padding:40px 0;
}

.hero h1{
font-size:32px;
}

.row{
flex-direction:column;
gap:6px;
}

.value{
max-width:100%;
text-align:left;
}

.nav{
min-height:64px;
}

.logo{
font-size:20px;
}

}

</style>

</head>

<body>

<header>

<div class="container nav">

<div class="logo">
SONATIVA
</div>

<a
class="back"
href="projects.html">

← My Projects

</a>

</div>

</header>


<main>

<div class="container">

<section class="hero">

<h1 id="projectTitle">
Loading...
</h1>

<p id="projectSubtitle">
Loading project information...
</p>

<div
class="status"
id="projectStatus">

<span class="status-dot"></span>

<span id="statusText">
Loading
</span>

</div>

</section>


<div id="content">

<div class="loading">
Loading your project...
</div>

</div>

</div>

</main>


<footer>
© 2026 Sonativa
</footer>


<script type="module">


/* =========================================================
   SUPABASE
========================================================= */

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://kallobeodjzzhrsaqszw.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_JH5v7Fix_d6HsHcRX2_vmw_wRVNLOkX";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   FORMAT BIG NUMBERS
========================================================= */

function formatBigNumber(value){

if(
value === null ||
value === undefined ||
value === ""
){

return "-";

}

try{

return BigInt(
String(value)
).toLocaleString("en-US");

}catch{

return escapeHtml(value);

}

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

if(!value){

return "-";

}

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
){

return "-";

}

return date.toLocaleString(
undefined,
{
dateStyle:"medium",
timeStyle:"short"
}
);

}


/* =========================================================
   TOKEN STATUS
========================================================= */

function normalizeStatus(status){

return String(
status || "draft"
)
.toLowerCase()
.trim();

}


function getStatusLabel(status){

switch(
normalizeStatus(status)
){

case "created":
return "Token Created";

case "minted":
return "Token Created";

case "failed":
return "Creation Failed";

case "creating":
return "Creating Token";

case "draft":
default:
return "Draft";

}

}


/* =========================================================
   EXPLORER NETWORK
========================================================= */

function getExplorerCluster(network){

const value =
String(network || "")
.toLowerCase();

if(
value.includes("devnet")
){

return "devnet";

}

if(
value.includes("testnet")
){

return "testnet";

}

return "";

}


function getExplorerAddressUrl(
mintAddress,
network
){

if(!mintAddress){

return "";

}

const cluster =
getExplorerCluster(network);

let url =
"https://explorer.solana.com/address/" +
encodeURIComponent(
mintAddress
);

if(cluster){

url +=
"?cluster=" +
encodeURIComponent(
cluster
);

}

return url;

}


function getExplorerTxUrl(
signature,
network
){

if(!signature){

return "";

}

const cluster =
getExplorerCluster(network);

let url =
"https://explorer.solana.com/tx/" +
encodeURIComponent(
signature
);

if(cluster){

url +=
"?cluster=" +
encodeURIComponent(
cluster
);

}

return url;

}


/* =========================================================
   TOKENOMICS
========================================================= */

function parseTokenomics(description){

if(!description){

return null;

}

const marker =
"--- SONATIVA TOKENOMICS ---";

if(
!description.includes(marker)
){

return null;

}

const section =
description
.split(marker)[1]
.trim();


const result = {};


section
.split(/\r?\n/)
.forEach(
function(line){

const match =
line.match(
/^([^:]+):\s*([\d.]+)%$/
);

if(!match){

return;

}

const key =
match[1]
.trim()
.toLowerCase()
.replace(/\s+/g,"_");


result[key] =
match[2] + "%";

});


return result;

}


/* =========================================================
   COPY TO CLIPBOARD
========================================================= */

async function copyText(
text,
button
){

if(!text){

return;

}

try{

await navigator.clipboard.writeText(
text
);

const original =
button.textContent;

button.textContent =
"Copied ✓";

button.classList.add(
"copy-success"
);

setTimeout(
function(){

button.textContent =
original;

button.classList.remove(
"copy-success"
);

},
1600
);

}catch(error){

console.error(
"Copy failed:",
error
);

alert(
"Could not copy automatically. Please copy it manually."
);

}

}


/* =========================================================
   GLOBAL COPY
========================================================= */

window.copyMint =
function(){

const element =
document.getElementById(
"mintAddressText"
);

const button =
document.getElementById(
"copyMintButton"
);

if(element){

copyText(
element.textContent,
button
);

}

};


window.copySignature =
function(){

const element =
document.getElementById(
"signatureText"
);

const button =
document.getElementById(
"copySignatureButton"
);

if(element){

copyText(
element.textContent,
button
);

}

};


/* =========================================================
   URL
========================================================= */

const params =
new URLSearchParams(
window.location.search
);

const projectId =
params.get("id");


/* =========================================================
   LOAD PROJECT
========================================================= */

async function loadProject(){

const content =
document.getElementById(
"content"
);


/* ---------------------------------------------------------
   NO PROJECT ID
--------------------------------------------------------- */

if(!projectId){

content.innerHTML = `

<div class="empty-box">

<h2>
No project selected
</h2>

<p>
Please select a project from My Projects.
</p>

<a
class="button primary"
href="projects.html">

← My Projects

</a>

</div>

`;

return;

}


/* ---------------------------------------------------------
   AUTH
--------------------------------------------------------- */

const {
data:{
user
},
error:userError
} =
await supabase.auth.getUser();


if(userError){

console.error(
"Auth error:",
userError
);

content.innerHTML = `

<div class="error-box">

<h2>
Unable to verify account
</h2>

<br>

${escapeHtml(
userError.message
)}

</div>

`;

return;

}


if(!user){

content.innerHTML = `

<div class="empty-box">

<h2>
You must login first
</h2>

<p>
Please login to view your project.
</p>

<a
class="button primary"
href="index.html">

Login

</a>

</div>

`;

return;

}


/* ---------------------------------------------------------
   GET PROJECT
--------------------------------------------------------- */

const {
data:project,
error
} =
await supabase

.from("projects")

.select(`
Id,
created_at,
user_id,
project_name,
token_name,
token_symbol,
total_supply,
network,
description,
decimals,
mint_address,
creation_signature,
token_status
`)

.eq(
"Id",
projectId
)

.eq(
"user_id",
user.id
)

.single();


/* ---------------------------------------------------------
   DATABASE ERROR
--------------------------------------------------------- */

if(error){

console.error(
"Project error:",
error
);

content.innerHTML = `

<div class="error-box">

<h2>
Project not found
</h2>

<br>

<p>
${escapeHtml(
error.message
)}
</p>

<br>

<a
class="button primary"
href="projects.html">

← My Projects

</a>

</div>

`;

return;

}


/* =========================================================
   HEADER
========================================================= */

document.getElementById(
"projectTitle"
).textContent =
project.project_name ||
"Unnamed Project";


document.getElementById(
"projectSubtitle"
).textContent =
project.token_name ||
"Sonativa Project";


const status =
normalizeStatus(
project.token_status
);


const statusElement =
document.getElementById(
"projectStatus"
);


document.getElementById(
"statusText"
).textContent =
getStatusLabel(
status
);


if(
status === "created" ||
status === "minted"
){

statusElement.classList.add(
"created"
);

}


/* =========================================================
   TOKENOMICS
========================================================= */

const tokenomics =
parseTokenomics(
project.description
);


let tokenomicsHTML =
"";


if(tokenomics){

tokenomicsHTML = `

<div class="card tokenomics">

<h2>
Tokenomics
</h2>

<div class="tokenomics-grid">

<div class="tokenomics-item">
<span>TEAM</span>
<strong>
${escapeHtml(
tokenomics.team || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>TREASURY</span>
<strong>
${escapeHtml(
tokenomics.treasury || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>COMMUNITY</span>
<strong>
${escapeHtml(
tokenomics.community || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>PUBLIC SALE</span>
<strong>
${escapeHtml(
tokenomics.public_sale || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>LIQUIDITY</span>
<strong>
${escapeHtml(
tokenomics.liquidity || "0%"
)}
</strong>
</div>

<div class="tokenomics-item">
<span>BURN RESERVE</span>
<strong>
${escapeHtml(
tokenomics.burn_reserve || "0%"
)}
</strong>
</div>

</div>

</div>

`;

}


/* =========================================================
   ON-CHAIN DATA
========================================================= */

let onChainHTML =
"";


if(
project.mint_address ||
project.creation_signature
){

const explorerAddress =
getExplorerAddressUrl(
project.mint_address,
project.network
);


const explorerTx =
getExplorerTxUrl(
project.creation_signature,
project.network
);


onChainHTML = `

<div class="card onchain">

<h2>
On-Chain Information
</h2>


${
project.mint_address
?
`

<div class="address-box">

<div class="address-label">
Mint Address
</div>

<div
class="address"
id="mintAddressText">
${escapeHtml(
project.mint_address
)}
</div>

<div class="address-actions">

<button
id="copyMintButton"
class="small-button"
onclick="copyMint()">

Copy

</button>

${
explorerAddress
?
`

<a
class="small-button primary"
href="${escapeHtml(
explorerAddress
)}"
target="_blank"
rel="noopener noreferrer">

View Mint

</a>

`
:
""
}

</div>

</div>

`
:
""
}


${
project.creation_signature
?
`

<div class="address-box">

<div class="address-label">
Creation Transaction
</div>

<div
class="address"
id="signatureText">
${escapeHtml(
project.creation_signature
)}
</div>

<div class="address-actions">

<button
id="copySignatureButton"
class="small-button"
onclick="copySignature()">

Copy

</button>

${
explorerTx
?
`

<a
class="small-button primary"
href="${escapeHtml(
explorerTx
)}"
target="_blank"
rel="noopener noreferrer">

View Transaction

</a>

`
:
""
}

</div>

</div>

`
:
""
}

</div>

`;

}


/* =========================================================
   DISPLAY
========================================================= */

content.innerHTML = `

<div class="grid">


<!-- PROJECT -->

<div class="card">

<h2>
Project Information
</h2>


<div class="row">

<span class="label">
Project Name
</span>

<span class="value">
${escapeHtml(
project.project_name ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Network
</span>

<span class="value">
${escapeHtml(
project.network ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Status
</span>

<span class="value">
${escapeHtml(
getStatusLabel(
project.token_status
)
)}
</span>

</div>


<div class="row">

<span class="label">
Created
</span>

<span class="value">
${formatDate(
project.created_at
)}
</span>

</div>

</div>


<!-- TOKEN -->

<div class="card">

<h2>
Token Information
</h2>


<div class="row">

<span class="label">
Token Name
</span>

<span class="value">
${escapeHtml(
project.token_name ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Token Symbol
</span>

<span class="value">
${escapeHtml(
project.token_symbol ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Total Supply
</span>

<span class="value">
${formatBigNumber(
project.total_supply
)}
</span>

</div>


<div class="row">

<span class="label">
Decimals
</span>

<span class="value">
${escapeHtml(
project.decimals ?? 6
)}
</span>

</div>

</div>


${tokenomicsHTML}


${onChainHTML}


<!-- DESCRIPTION -->

<div class="card description">

<h2>
Project Description
</h2>

<div class="description-text">
${escapeHtml(
project.description ||
"No description provided."
)}
</div>

</div>


</div>


<div class="actions">

<a
class="button primary"
href="projects.html">

← My Projects

</a>


<a
class="button"
href="token-studio.html">

Create Another Project

</a>


<a
class="button"
href="tokenomics-studio.html?id=${encodeURIComponent(
project.Id
)}">

Edit Tokenomics

</a>

</div>

`;

}


/* =========================================================
   START
========================================================= */

loadProject();

</script>

</body>

</html>
