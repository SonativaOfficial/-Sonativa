<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Projects — Sonativa</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(
circle at 50% -10%,
#172033 0%,
#06080d 45%,
#040509 100%
);
color:#fff;
min-height:100vh;
}

.container{
width:92%;
max-width:1050px;
margin:auto;
}

header{
border-bottom:1px solid #202633;
background:rgba(5,7,12,.92);
backdrop-filter:blur(10px);
}

.nav{
min-height:72px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:23px;
font-weight:900;
letter-spacing:3px;
}

.logo a{
color:#fff;
text-decoration:none;
}

.nav-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.button{
display:inline-block;
padding:11px 16px;
border-radius:9px;
border:1px solid #303847;
background:#10151e;
color:#fff;
text-decoration:none;
font-size:13px;
font-weight:bold;
cursor:pointer;
}

.button:hover{
background:#171d28;
}

.button.primary{
background:#fff;
color:#06080d;
border-color:#fff;
}

main{
padding:55px 0;
}

.hero{
text-align:center;
margin-bottom:35px;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
color:#818b9c;
font-size:15px;
}

.toolbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
}

.count{
color:#818b9c;
font-size:13px;
}

.projects{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(290px,1fr));
gap:18px;
}

.project-card{
background:rgba(12,16,23,.94);
border:1px solid #252d3b;
border-radius:16px;
padding:22px;
box-shadow:0 12px 40px rgba(0,0,0,.15);
transition:.2s;
}

.project-card:hover{
border-color:#3b4659;
transform:translateY(-2px);
}

.project-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
margin-bottom:18px;
}

.project-name{
font-size:20px;
font-weight:bold;
word-break:break-word;
}

.status{
display:inline-flex;
align-items:center;
gap:6px;
padding:6px 10px;
border-radius:20px;
background:#151a24;
border:1px solid #303847;
color:#9ca6b7;
font-size:11px;
white-space:nowrap;
}

.status.created{
color:#8ee6b0;
border-color:#315c45;
}

.status.failed{
color:#ff8f8f;
border-color:#633737;
}

.status-dot{
width:6px;
height:6px;
border-radius:50%;
background:#8b95a7;
}

.status.created .status-dot{
background:#57d88b;
}

.status.failed .status-dot{
background:#ff7070;
}

.project-token{
color:#8d96a7;
font-size:14px;
margin-bottom:18px;
}

.info{
border-top:1px solid #202733;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:11px 0;
border-bottom:1px solid #202733;
}

.row:last-child{
border-bottom:0;
}

.label{
color:#707b8e;
font-size:12px;
}

.value{
font-size:13px;
text-align:right;
word-break:break-word;
max-width:65%;
}

.card-actions{
display:flex;
gap:8px;
margin-top:18px;
flex-wrap:wrap;
}

.small-button{
padding:9px 12px;
border-radius:8px;
border:1px solid #303847;
background:#10151e;
color:#fff;
cursor:pointer;
font-size:12px;
text-decoration:none;
font-weight:bold;
}

.small-button:hover{
background:#171d28;
}

.small-button.primary{
background:#fff;
color:#06080d;
border-color:#fff;
}

.small-button.danger{
color:#ff8f8f;
border-color:#633737;
}

.small-button.danger:hover{
background:#1b0d0d;
}

.loading,
.error,
.empty{
text-align:center;
padding:50px 20px;
}

.loading{
color:#818b9c;
}

.error-box,
.empty-box{
background:#0d1119;
border:1px solid #252d3b;
border-radius:16px;
padding:35px 20px;
text-align:center;
}

.error-box{
border-color:#633737;
}

.error-box h2{
color:#ff8f8f;
margin-bottom:10px;
}

.empty-box h2{
margin-bottom:10px;
}

.empty-box p{
color:#818b9c;
margin-bottom:22px;
}

.message{
display:none;
margin-bottom:20px;
padding:14px;
border-radius:10px;
background:#10151e;
border:1px solid #303847;
color:#aeb7c6;
word-break:break-word;
}

.message.success{
display:block;
color:#8ee6b0;
border-color:#315c45;
}

.message.error{
display:block;
color:#ff8f8f;
border-color:#633737;
}

footer{
text-align:center;
padding:45px 0;
color:#697386;
font-size:13px;
}

@media(max-width:600px){

main{
padding:40px 0;
}

.hero h1{
font-size:32px;
}

.nav{
min-height:64px;
}

.logo{
font-size:20px;
}

.project-top{
flex-direction:column;
}

.status{
align-self:flex-start;
}

}

</style>

</head>


<body>


<header>

<div class="container nav">

<div class="logo">

<a href="index.html">
SONATIVA
</a>

</div>


<div class="nav-actions">

<a
class="button"
href="index.html">

Home

</a>


<a
class="button primary"
href="token-studio.html">

+ New Project

</a>

</div>

</div>

</header>


<main>

<div class="container">


<section class="hero">

<h1>
My Projects
</h1>

<p>
Manage your Sonativa token projects.
</p>

</section>


<div
id="message"
class="message">
</div>


<div class="toolbar">

<div
id="projectCount"
class="count">

Loading projects...

</div>


<a
class="button primary"
href="token-studio.html">

+ Create Project

</a>

</div>


<div
id="content">

<div class="loading">

Loading your projects...

</div>

</div>


</div>

</main>


<footer>

© 2026 Sonativa

</footer>



<script type="module">


/* =========================================================
   SUPABASE
========================================================= */

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
"https://kallobeodjzzhrsaqszw.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_JH5v7Fix_d6HsHcRX2_vmw_wRVNLOkX";


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

return String(value ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   FORMAT SUPPLY
========================================================= */

function formatSupply(value){

if(
value === null ||
value === undefined ||
value === ""
){

return "-";

}

try{

return BigInt(
String(value)
).toLocaleString("en-US");

}catch{

return String(value);

}

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

if(!value){

return "-";

}

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
){

return "-";

}

return date.toLocaleDateString(
undefined,
{
year:"numeric",
month:"short",
day:"numeric"
}
);

}


/* =========================================================
   STATUS
========================================================= */

function normalizeStatus(status){

return String(
status || "draft"
)
.toLowerCase()
.trim();

}


function getStatusLabel(status){

switch(
normalizeStatus(status)
){

case "created":
case "minted":
return "Created";

case "creating":
return "Creating";

case "failed":
return "Failed";

case "draft":
default:
return "Draft";

}

}


function getStatusClass(status){

const value =
normalizeStatus(status);

if(
value === "created" ||
value === "minted"
){

return "created";

}

if(
value === "failed"
){

return "failed";

}

return "";

}


/* =========================================================
   DELETE PROJECT
========================================================= */

window.deleteProject =
async function(projectId){

if(!projectId){

return;

}


const confirmed =
confirm(
"Are you sure you want to delete this project?"
);


if(!confirmed){

return;

}


const {
error
} =
await supabase

.from("projects")

.delete()

.eq(
"Id",
projectId
);


if(error){

console.error(
"Delete project error:",
error
);

showMessage(
"Could not delete project: " +
error.message,
"error"
);

return;

}


showMessage(
"Project deleted successfully.",
"success"
);


await loadProjects();

};


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
text,
type
){

const message =
document.getElementById(
"message"
);

message.textContent =
text;

message.className =
"message " +
type;

message.style.display =
"block";


setTimeout(
function(){

message.style.display =
"none";

},
3500
);

}


/* =========================================================
   LOGIN
========================================================= */

async function getCurrentUser(){

const {
data,
error
} =
await supabase.auth.getUser();


if(error){

console.error(
"Auth error:",
error
);

return null;

}


return data.user || null;

}


/* =========================================================
   LOAD PROJECTS
========================================================= */

async function loadProjects(){

const content =
document.getElementById(
"content"
);

const count =
document.getElementById(
"projectCount"
);


content.innerHTML = `

<div class="loading">

Loading your projects...

</div>

`;

count.textContent =
"Loading projects...";


/* ---------------------------------------------------------
   AUTH
--------------------------------------------------------- */

const user =
await getCurrentUser();


if(!user){

count.textContent =
"";


content.innerHTML = `

<div class="empty-box">

<h2>
Login Required
</h2>

<p>
Please login to view your projects.
</p>

<a
class="button primary"
href="index.html">

Login

</a>

</div>

`;

return;

}


/* ---------------------------------------------------------
   GET PROJECTS
--------------------------------------------------------- */

const {
data:projects,
error
} =
await supabase

.from("projects")

.select(`

Id,
created_at,
user_id,
project_name,
token_name,
token_symbol,
total_supply,
network,
description,
decimals,
mint_address,
creation_signature,
token_status

`)

.eq(
"user_id",
user.id
)

.order(
"created_at",
{
ascending:false
}
);


/* ---------------------------------------------------------
   DATABASE ERROR
--------------------------------------------------------- */

if(error){

console.error(
"Projects error:",
error
);

count.textContent =
"";


content.innerHTML = `

<div class="error-box">

<h2>
Unable to load projects
</h2>

<p>
${escapeHtml(
error.message
)}
</p>

</div>

`;

return;

}


/* ---------------------------------------------------------
   EMPTY
--------------------------------------------------------- */

if(
!projects ||
projects.length === 0
){

count.textContent =
"0 projects";


content.innerHTML = `

<div class="empty-box">

<h2>
No Projects Yet
</h2>

<p>
Create your first Solana token project with Sonativa.
</p>

<a
class="button primary"
href="token-studio.html">

+ Create Your First Project

</a>

</div>

`;

return;

}


/* ---------------------------------------------------------
   COUNT
--------------------------------------------------------- */

count.textContent =
projects.length +
(
projects.length === 1
?
" project"
:
" projects"
);


/* ---------------------------------------------------------
   CARDS
--------------------------------------------------------- */

let html =
'<div class="projects">';


projects.forEach(
function(project){

const status =
normalizeStatus(
project.token_status
);


const statusClass =
getStatusClass(
status
);


const statusLabel =
getStatusLabel(
status
);


html += `

<div class="project-card">


<div class="project-top">

<div class="project-name">

${escapeHtml(
project.project_name ||
"Unnamed Project"
)}

</div>


<div
class="status ${statusClass}">

<span class="status-dot"></span>

${escapeHtml(
statusLabel
)}

</div>

</div>


<div class="project-token">

${escapeHtml(
project.token_name ||
"No Token Name"
)}

${
project.token_symbol
?
" (" +
escapeHtml(
project.token_symbol
) +
")"
:
""
}

</div>


<div class="info">


<div class="row">

<span class="label">
Network
</span>

<span class="value">
${escapeHtml(
project.network ||
"-"
)}
</span>

</div>


<div class="row">

<span class="label">
Total Supply
</span>

<span class="value">
${formatSupply(
project.total_supply
)}
</span>

</div>


<div class="row">

<span class="label">
Decimals
</span>

<span class="value">
${escapeHtml(
project.decimals ?? 6
)}
</span>

</div>


<div class="row">

<span class="label">
Created
</span>

<span class="value">
${formatDate(
project.created_at
)}
</span>

</div>


</div>


<div class="card-actions">


<a
class="small-button primary"
href="project.html?id=${encodeURIComponent(
project.Id
)}">

View Project

</a>


${
project.mint_address
?
`

<a
class="small-button"
href="https://explorer.solana.com/address/${encodeURIComponent(
project.mint_address
)}${
String(project.network || "")
.toLowerCase()
.includes("devnet")
?
"?cluster=devnet"
:
""
}"
target="_blank"
rel="noopener noreferrer">

Explorer

</a>

`
:
""
}


<button
class="small-button danger"
onclick="deleteProject('${escapeHtml(
project.Id
)}')">

Delete

</button>


</div>


</div>

`;

});


html +=
"</div>";


content.innerHTML =
html;

}


/* =========================================================
   START
========================================================= */

loadProjects();


</script>


</body>

</html>
