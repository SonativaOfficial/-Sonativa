<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sonativa — My Projects</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(
circle at 50% -10%,
#172033 0%,
#06080d 45%,
#040509 100%
);
color:#fff;
min-height:100vh;
}

.container{
width:92%;
max-width:1100px;
margin:auto;
}

header{
border-bottom:1px solid #202633;
background:rgba(5,7,12,.9);
}

.nav{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:23px;
font-weight:900;
letter-spacing:3px;
}

.back{
padding:10px 15px;
border:1px solid #303847;
border-radius:9px;
background:#10151e;
color:#fff;
text-decoration:none;
}

main{
padding:60px 0;
}

.title{
text-align:center;
margin-bottom:40px;
}

.title h1{
font-size:42px;
margin-bottom:10px;
}

.title p{
color:#818b9c;
}

.projects{
display:grid;
grid-template-columns:
repeat(
auto-fit,
minmax(300px,1fr)
);
gap:20px;
}

.project{
background:#0c1017;
border:1px solid #252d3b;
border-radius:16px;
padding:25px;
}

.project-name{
font-size:24px;
font-weight:bold;
margin-bottom:20px;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:12px 0;
border-bottom:1px solid #202733;
}

.label{
color:#707b8e;
font-size:13px;
}

.value{
font-size:14px;
text-align:right;
word-break:break-word;
max-width:65%;
}

.description{
margin-top:18px;
padding:15px;
background:#080b12;
border:1px solid #202733;
border-radius:10px;
}

.description-title{
color:#707b8e;
font-size:12px;
margin-bottom:7px;
}

.description-text{
color:#b7bfcc;
font-size:14px;
line-height:1.6;
}

.actions{
display:flex;
gap:10px;
margin-top:20px;
}

.btn{
flex:1;
padding:12px;
border-radius:9px;
font-weight:bold;
border:1px solid #303847;
cursor:pointer;
text-decoration:none;
text-align:center;
}

.open{
background:#fff;
color:#06080d;
}

.delete{
background:#10151e;
color:#ff8f8f;
}

.message{
text-align:center;
padding:35px;
color:#818b9c;
}

.error{
color:#ff8f8f;
}

</style>

</head>

<body>

<header>

<div class="container nav">

<div class="logo">
SONATIVA
</div>

<a
class="back"
href="index.html">

← Dashboard

</a>

</div>

</header>


<main>

<div class="container">

<div class="title">

<h1>
My Projects
</h1>

<p>
Your Sonativa projects
</p>

</div>


<div
class="projects"
id="projects">

<div class="message">
Loading your projects...
</div>

</div>

</div>

</main>


<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://kallobeodjzzhrsaqszw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_JH5v7Fix_d6HsHcRX2_vmw_wRVNLOkX";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   ELEMENT
========================= */

const container =
document.getElementById(
"projects"
);


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

return String(value ?? "")

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


function formatSupply(value){

if(
value === null ||
value === undefined ||
value === ""
){

return "-";

}

const number =
Number(value);

if(
Number.isNaN(number)
){

return escapeHtml(value);

}

return number.toLocaleString();

}


function formatDate(value){

if(!value){

return "-";

}

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
){

return "-";

}

return date.toLocaleString();

}


/* =========================
   LOAD PROJECTS
========================= */

async function loadProjects(){

container.innerHTML = `

<div class="message">
Loading your projects...
</div>

`;


/* =========================
   USER
========================= */

const {
data:{
user
},
error:userError
} =
await supabase.auth.getUser();


if(userError){

container.innerHTML = `

<div class="message error">

${escapeHtml(
userError.message
)}

</div>

`;

return;

}


if(!user){

container.innerHTML = `

<div class="message">

You must login first.

<br><br>

<a
class="back"
href="index.html">

Login

</a>

</div>

`;

return;

}


/* =========================
   PROJECTS
========================= */

/*
IMPORTANT:

The database column is:

Id

Capital I

NOT:

id
*/

const {
data,
error
} =
await supabase

.from("projects")

.select(`
Id,
created_at,
user_id,
project_name,
token_name,
token_symbol,
total_supply,
network,
description
`)

.eq(
"user_id",
user.id
)

.order(
"created_at",
{
ascending:false
}
);


/* =========================
   ERROR
========================= */

if(error){

console.error(
"Projects error:",
error
);

container.innerHTML = `

<div class="message error">

<h3>
Error loading projects
</h3>

<br>

${escapeHtml(
error.message
)}

</div>

`;

return;

}


/* =========================
   EMPTY
========================= */

if(
!data ||
data.length === 0
){

container.innerHTML = `

<div class="message">

You don't have any projects yet.

<br><br>

<a
class="back"
href="token-studio.html">

Create Project

</a>

</div>

`;

return;

}


/* =========================
   DISPLAY
========================= */

container.innerHTML = "";


data.forEach(
function(project){

const card =
document.createElement(
"div"
);

card.className =
"project";


card.innerHTML = `

<div class="project-name">

${escapeHtml(
project.project_name ||
"Unnamed Project"
)}

</div>


<div class="row">

<span class="label">
Token Name
</span>

<span class="value">

${escapeHtml(
project.token_name ||
"-"
)}

</span>

</div>


<div class="row">

<span class="label">
Token Symbol
</span>

<span class="value">

${escapeHtml(
project.token_symbol ||
"-"
)}

</span>

</div>


<div class="row">

<span class="label">
Total Supply
</span>

<span class="value">

${formatSupply(
project.total_supply
)}

</span>

</div>


<div class="row">

<span class="label">
Network
</span>

<span class="value">

${escapeHtml(
project.network ||
"-"
)}

</span>

</div>


<div class="row">

<span class="label">
Created
</span>

<span class="value">

${formatDate(
project.created_at
)}

</span>

</div>


<div class="description">

<div class="description-title">
DESCRIPTION
</div>

<div class="description-text">

${escapeHtml(
project.description ||
"No description provided."
)}

</div>

</div>


<div class="actions">


<a
class="btn open"
href="project.html?id=${encodeURIComponent(
project.Id
)}">

OPEN PROJECT

</a>


<button
class="btn delete">

DELETE

</button>


</div>

`;


/* =========================
   DELETE
========================= */

const deleteButton =
card.querySelector(
".delete"
);


deleteButton.addEventListener(
"click",
async function(){

const confirmed =
confirm(
'Delete project "' +
(
project.project_name ||
"Unnamed Project"
) +
'"?'
);


if(!confirmed){

return;

}


const {
data:{
user
}
} =
await supabase.auth.getUser();


if(!user){

alert(
"You must login first."
);

return;

}


const {
error:deleteError
} =
await supabase

.from("projects")

.delete()

.eq(
"Id",
project.Id
)

.eq(
"user_id",
user.id
);


if(deleteError){

alert(
"Delete failed: " +
deleteError.message
);

return;

}


loadProjects();

});


container.appendChild(
card
);

});

}


/* =========================
   START
========================= */

loadProjects();

</script>

</body>

</html>
