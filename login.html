<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sonativa — Founder Sign In</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:#04060b;color:#fff}
.card{width:min(430px,100%);padding:32px;background:#0b111b;border:1px solid #202b3d;border-radius:18px;box-shadow:0 25px 80px #0008}
.logo{text-align:center;font-size:25px;font-weight:900;letter-spacing:5px}
.sub{text-align:center;margin-top:9px;color:#8793a6;font-size:12px}
.badge{text-align:center;margin-top:18px;color:#62e39a;font-size:11px}
button{width:100%;height:46px;margin-top:28px;border-radius:9px;font-weight:bold;cursor:pointer;background:white;color:#05070c;border:0}
button:disabled{opacity:.6;cursor:not-allowed}
#message{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:11px;line-height:1.5}
.error{display:block!important;color:#ff9b9b;background:#190c0c;border:1px solid #4b2020}
.success{display:block!important;color:#62e39a;background:#091710;border:1px solid #214b35}
.back{display:block;margin-top:18px;text-align:center;color:#78869b;font-size:10px;text-decoration:none}
.footer{margin-top:22px;text-align:center;color:#566276;font-size:9px;line-height:1.7}
</style>
</head>

<body>

<div class="card">

<div class="logo">SONATIVA</div>

<div class="sub">Secure access to your Web3 workspace</div>

<div class="badge">🔒 Founder Access</div>

<button id="githubBtn">
Continue with GitHub
</button>

<div id="message"></div>

<a class="back" href="index.html">
← Back to Sonativa
</a>

<div class="footer">
Your wallet remains under your control.<br>
Sonativa never asks for private keys or seed phrases.
</div>

</div>

<script type="module">

import{createClient}
from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase=createClient(
"https://kallobeodjzzhrsaqszw.supabase.co",
"sb_publishable_JH5v7Fix_d6HsHcRX2_vmw_wRVNLOkX"
);

const button=document.getElementById("githubBtn");
const message=document.getElementById("message");

function show(text,type){
message.textContent=text;
message.className=type;
}

async function verifyFounder(){

const{data,error}=await supabase
.rpc("is_sonativa_founder");

if(error){

console.error("Founder verification error:",error);

show(
"Founder verification failed. Please try again.",
"error"
);

button.disabled=false;
button.textContent="Continue with GitHub";

return;

}

if(data===true){

show(
"Founder verified. Opening Founder Control Center...",
"success"
);

setTimeout(()=>{
window.location.href="founder.html";
},700);

return;

}

show(
"Your account is signed in, but Founder access was not found.",
"error"
);

button.disabled=false;
button.textContent="Continue with GitHub";

}

button.addEventListener("click",async()=>{

button.disabled=true;
button.textContent="Connecting to GitHub...";
message.className="";

const{error}=await supabase.auth.signInWithOAuth({

provider:"github",

options:{
redirectTo:
"https://sonativaofficial.github.io/-Sonativa/login.html"
}

});

if(error){

console.error(error);

show(
"GitHub sign in failed: "+error.message,
"error"
);

button.disabled=false;
button.textContent="Continue with GitHub";

}

});

supabase.auth.onAuthStateChange(
async(event,session)=>{

if(
event==="SIGNED_IN"&&
session
){

await verifyFounder();

}

});

async function start(){

const{data}=await supabase.auth.getSession();

if(
data&&
data.session
){

await verifyFounder();

}

}

start();

</script>

</body>
</html>
