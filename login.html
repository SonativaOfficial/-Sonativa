<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sonativa — Sign In</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:#04060b;color:#fff}
.card{width:min(430px,100%);padding:32px;background:#0b111b;border:1px solid #202b3d;border-radius:18px;box-shadow:0 25px 80px #0008}
.logo{text-align:center;font-size:25px;font-weight:900;letter-spacing:5px}
.sub{text-align:center;margin-top:9px;color:#8793a6;font-size:12px}
button{width:100%;height:46px;border-radius:9px;font-weight:bold;cursor:pointer}
.github{margin-top:28px;background:white;color:#05070c;border:0}
#message{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:11px;line-height:1.5}
.error{display:block!important;color:#ff9b9b;background:#190c0c;border:1px solid #4b2020}
.success{display:block!important;color:#62e39a;background:#091710;border:1px solid #214b35}
.back{display:block;margin-top:18px;text-align:center;color:#78869b;font-size:10px;text-decoration:none}
.footer{margin-top:22px;text-align:center;color:#566276;font-size:9px;line-height:1.7}
</style>
</head>

<body>

<div class="card">

<div class="logo">SONATIVA</div>

<div class="sub">
Secure access to your Web3 workspace
</div>

<button class="github" id="githubBtn">
Continue with GitHub
</button>

<div id="message"></div>

<a class="back" href="index.html">
← Back to Sonativa
</a>

<div class="footer">
Your wallet remains under your control.<br>
Sonativa never asks for private keys or seed phrases.
</div>

</div>

<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase =
createClient(
"https://kallobeodjzzhrsaqszw.supabase.co",
"sb_publishable_JH5v7Fix_d6HsHcRX2_vmw_wRVNLOkX"
);

const githubBtn =
document.getElementById("githubBtn");

const message =
document.getElementById("message");

function showMessage(text,type){

message.textContent=text;
message.className=type;

}

async function checkFounder(user){

if(!user){

showMessage(
"Please sign in with your GitHub account.",
"error"
);

return;

}

const {
data,
error
} =
await supabase
.from("user_roles")
.select("role")
.eq("user_id",user.id)
.maybeSingle();

if(error){

console.error(error);

showMessage(
"Could not verify your Sonativa role.",
"error"
);

return;

}

if(
data &&
data.role === "founder"
){

showMessage(
"Founder verified. Opening Founder Control Center...",
"success"
);

setTimeout(
function(){
window.location.href="founder.html";
},
500
);

return;

}

showMessage(
"Your account does not have Founder access.",
"error"
);

}

githubBtn.addEventListener(
"click",
async function(){

githubBtn.disabled=true;

githubBtn.textContent=
"Connecting to GitHub...";

message.className="";

const {
error
} =
await supabase.auth.signInWithOAuth({

provider:"github",

options:{
redirectTo:
"https://sonativaofficial.github.io/-Sonativa/login.html"
}

});

if(error){

console.error(error);

showMessage(
"GitHub sign in failed: "+error.message,
"error"
);

githubBtn.disabled=false;

githubBtn.textContent=
"Continue with GitHub";

}

});

supabase.auth.onAuthStateChange(
async function(event,session){

if(
event === "SIGNED_IN" &&
session
){

await checkFounder(
session.user
);

}

});

async function start(){

const {
data
} =
await supabase.auth.getSession();

if(
data &&
data.session
){

await checkFounder(
data.session.user
);

}

}

start();

</script>

</body>
</html>
