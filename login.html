<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sonativa — Sign In</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:#04060b;color:#fff}
.card{width:min(430px,100%);padding:32px;background:#0b111b;border:1px solid #202b3d;border-radius:18px;box-shadow:0 25px 80px #0008}
.logo{text-align:center;font-size:25px;font-weight:900;letter-spacing:5px}
.sub{text-align:center;margin-top:9px;color:#8793a6;font-size:12px}
form{margin-top:28px}
label{display:block;margin:0 0 7px;color:#aeb8c8;font-size:11px;font-weight:bold}
input{width:100%;height:46px;padding:0 13px;margin-bottom:16px;background:#090e17;color:white;border:1px solid #202b3d;border-radius:9px;outline:none}
button{width:100%;height:46px;border-radius:9px;font-weight:bold;cursor:pointer}
.email{background:white;color:#05070c;border:0}
.github{margin-top:10px;background:#151b25;color:white;border:1px solid #303b4d}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:#566276;font-size:10px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:#202b3d}
#message{display:none;margin-top:15px;padding:11px;border-radius:9px;font-size:11px}
.error{display:block!important;color:#ff9b9b;background:#190c0c;border:1px solid #4b2020}
.success{display:block!important;color:#62e39a;background:#091710;border:1px solid #214b35}
.back{display:block;margin-top:18px;text-align:center;color:#78869b;font-size:10px;text-decoration:none}
.footer{margin-top:22px;text-align:center;color:#566276;font-size:9px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
<div class="logo">SONATIVA</div>
<div class="sub">Secure access to your Web3 workspace</div>
<form id="form">
<label>Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
<label>Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
<button class="email" id="emailBtn" type="submit">Sign In with Email</button>
</form>
<div class="divider">OR</div>
<button class="github" id="githubBtn" type="button">Continue with GitHub</button>
<div id="message"></div>
<a class="back" href="index.html">← Back to Sonativa</a>
<div class="footer">Your wallet remains under your control.<br>Sonativa never asks for private keys or seed phrases.</div>
</div>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://kallobeodjzzhrsaqszw.supabase.co","sb_publishable_JH5v7Fix_d6HsHcRX2_vmw_wRVNLOkX");
const form=document.getElementById("form"),email=document.getElementById("email"),password=document.getElementById("password"),emailBtn=document.getElementById("emailBtn"),githubBtn=document.getElementById("githubBtn"),message=document.getElementById("message");
function msg(text,type="error"){message.textContent=text;message.className=type}
async function checkRole(user){
if(!user){msg("User session could not be verified.");return}
const{data,error}=await supabase.from("user_roles").select("role").eq("user_id",user.id).maybeSingle();
if(error){console.error(error);msg("Login succeeded, but your Sonativa role could not be verified.");return}
msg("Login successful. Opening Sonativa...","success");
setTimeout(()=>{location.href=data&&data.role==="founder"?"founder.html":"index.html"},600)
}
form.addEventListener("submit",async e=>{
e.preventDefault();message.className="";emailBtn.disabled=true;emailBtn.textContent="Signing in...";
const{data,error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});
if(error){msg("Email sign in failed: "+error.message);emailBtn.disabled=false;emailBtn.textContent="Sign In with Email";return}
await checkRole(data.user)
});
githubBtn.addEventListener("click",async()=>{
message.className="";githubBtn.disabled=true;githubBtn.textContent="Connecting to GitHub...";
const{error}=await supabase.auth.signInWithOAuth({provider:"github",options:{redirectTo:"https://sonativaofficial.github.io/-Sonativa/login.html"}});
if(error){msg("GitHub sign in failed: "+error.message);githubBtn.disabled=false;githubBtn.textContent="Continue with GitHub"}
});
async function checkExistingSession(){
const{data}=await supabase.auth.getSession();
if(data.session&&data.session.user)await checkRole(data.session.user)
}
checkExistingSession();
</script>
</body>
</html>
