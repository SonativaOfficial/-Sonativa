<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Token Studio — Sonativa</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#07090f;
color:#fff;
line-height:1.6;
}

.container{
width:92%;
max-width:900px;
margin:auto;
}

header{
border-bottom:1px solid #202735;
padding:20px 0;
}

.logo{
font-size:23px;
font-weight:800;
}

.logo a{
color:white;
text-decoration:none;
}

.hero{
text-align:center;
padding:50px 0 30px;
}

.hero h1{
font-size:40px;
margin-bottom:10px;
}

.hero p{
color:#8d96a7;
}

.steps{
display:flex;
gap:8px;
margin:25px 0;
overflow:auto;
}

.step{
padding:10px 15px;
border:1px solid #293142;
border-radius:8px;
color:#8992a3;
white-space:nowrap;
}

.step.active{
color:white;
background:#151a24;
border-color:#555f72;
}

.panel{
background:#0d1119;
border:1px solid #242c3b;
border-radius:16px;
padding:30px;
margin-bottom:20px;
}

.panel h2{
margin-bottom:20px;
}

label{
display:block;
margin:16px 0 7px;
font-size:14px;
color:#b5bdca;
}

input,select,textarea{
width:100%;
padding:13px;
border-radius:9px;
border:1px solid #303949;
background:#080b12;
color:white;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

.grid{
display:grid;
grid-template-columns:1fr;
gap:15px;
}

.tokenomics{
margin-top:25px;
padding-top:20px;
border-top:1px solid #242c3b;
}

.allocation{
display:grid;
grid-template-columns:1fr 120px;
gap:10px;
margin-bottom:10px;
}

.percent{
text-align:center;
}

.total-box{
margin-top:20px;
padding:16px;
border-radius:10px;
background:#080b12;
border:1px solid #303949;
display:flex;
justify-content:space-between;
align-items:center;
}

.total-ok{
color:#8ee6b0;
}

.total-error{
color:#ff8f8f;
}

button{
margin-top:25px;
padding:14px 22px;
border:0;
border-radius:9px;
background:white;
color:#07090f;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.message{
display:none;
margin-top:20px;
padding:14px;
border-radius:10px;
background:#10151e;
border:1px solid #303949;
color:#aeb7c6;
}

.result{
display:none;
margin-top:25px;
padding:20px;
border:1px solid #303949;
border-radius:12px;
background:#080b12;
}

.result p{
margin:8px 0;
color:#aab3c2;
}

.back{
display:inline-block;
margin-top:20px;
color:#8d96a7;
text-decoration:none;
}

footer{
text-align:center;
padding:40px 0;
color:#697386;
}

@media(min-width:700px){
.grid{
grid-template-columns:1fr 1fr;
}
}
</style>
</head>

<body>

<header>
<div class="container">
<div class="logo">
<a href="index.html">SONATIVA</a>
</div>
</div>
</header>

<main class="container">

<section class="hero">
<h1>Token Studio</h1>
<p>Design and plan your Web3 project.</p>
</section>

<div class="steps">
<div class="step active">1 Project</div>
<div class="step active">2 Supply</div>
<div class="step active">3 Tokenomics</div>
<div class="step">4 Review</div>
</div>

<section class="panel">

<h2>Project Information</h2>

<div class="grid">

<div>
<label>Project Name</label>
<input id="projectName" placeholder="Example: Sonativa">
</div>

<div>
<label>Token Name</label>
<input id="tokenName" placeholder="Example: Sonativa Token">
</div>

<div>
<label>Token Symbol</label>
<input id="tokenSymbol" maxlength="20" placeholder="Example: SONA">
</div>

<div>
<label>Total Supply</label>
<input id="supply" type="number" min="1" placeholder="100000000">
</div>

</div>

<label>Network</label>

<select id="network">
<option value="Solana">Solana</option>
<option value="Base">Base</option>
<option value="Ethereum">Ethereum</option>
<option value="BNB Chain">BNB Chain</option>
</select>

<label>Description</label>

<textarea
id="description"
placeholder="Describe your project..."></textarea>

<div class="tokenomics">

<h2>Tokenomics</h2>

<p style="color:#818b9c;font-size:14px;margin-bottom:15px;">
Define how your total supply will be distributed.
</p>

<label>Team</label>
<div class="allocation">
<input class="allocation-name" value="Team" disabled>
<input class="allocation-percent percent" id="team" type="number" min="0" max="100" value="5">
</div>

<label>Treasury</label>
<div class="allocation">
<input class="allocation-name" value="Treasury" disabled>
<input class="allocation-percent percent" id="treasury" type="number" min="0" max="100" value="10">
</div>

<label>Community</label>
<div class="allocation">
<input class="allocation-name" value="Community" disabled>
<input class="allocation-percent percent" id="community" type="number" min="0" max="100" value="20">
</div>

<label>Public Sale</label>
<div class="allocation">
<input class="allocation-name" value="Public Sale" disabled>
<input class="allocation-percent percent" id="sale" type="number" min="0" max="100" value="25">
</div>

<label>Liquidity</label>
<div class="allocation">
<input class="allocation-name" value="Liquidity" disabled>
<input class="allocation-percent percent" id="liquidity" type="number" min="0" max="100" value="10">
</div>

<label>Burn Reserve</label>
<div class="allocation">
<input class="allocation-name" value="Burn Reserve" disabled>
<input class="allocation-percent percent" id="burn" type="number" min="0" max="100" value="30">
</div>

<div class="total-box">

<span>Total Allocation</span>

<strong id="allocationTotal">
100%
</strong>

</div>

</div>

<button
id="generateButton"
onclick="generateProject()">

Generate & Save Project

</button>

<div id="message" class="message"></div>

<div id="result" class="result">

<h3>Project Saved Successfully ✅</h3>

<p id="rProject"></p>
<p id="rToken"></p>
<p id="rSymbol"></p>
<p id="rSupply"></p>
<p id="rNetwork"></p>

<h3 style="margin-top:20px;">
Tokenomics
</h3>

<p id="rTokenomics"></p>

<a class="back" href="projects.html">
← My Projects
</a>

</div>

</section>

</main>

<footer>
© 2026 Sonativa — Token Studio
</footer>

<script type="module">

import {
createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://kallobeodjzzhrsaqszw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_JH5v7Fix_d6HsHcRX2_vmw_wRVNLOkX";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================
MESSAGE
========================= */

function showMessage(text){

const message =
document.getElementById("message");

message.textContent = text;
message.style.display = "block";

}


/* =========================
ESCAPE
========================= */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
TOKENOMICS TOTAL
========================= */

function calculateAllocation(){

const ids = [
"team",
"treasury",
"community",
"sale",
"liquidity",
"burn"
];

let total = 0;

ids.forEach(function(id){

total += Number(
document.getElementById(id).value
) || 0;

});

const display =
document.getElementById(
"allocationTotal"
);

display.textContent =
total + "%";

if(total === 100){

display.className =
"total-ok";

}else{

display.className =
"total-error";

}

return total;

}


/* =========================
LISTEN
========================= */

[
"team",
"treasury",
"community",
"sale",
"liquidity",
"burn"
].forEach(function(id){

document
.getElementById(id)
.addEventListener(
"input",
calculateAllocation
);

});


calculateAllocation();


/* =========================
GENERATE PROJECT
========================= */

window.generateProject =
async function(){

const button =
document.getElementById(
"generateButton"
);

const project =
document.getElementById(
"projectName"
).value.trim();

const token =
document.getElementById(
"tokenName"
).value.trim();

const symbol =
document.getElementById(
"tokenSymbol"
).value.trim().toUpperCase();

const supply =
document.getElementById(
"supply"
).value;

const network =
document.getElementById(
"network"
).value;

const description =
document.getElementById(
"description"
).value.trim();


/* VALIDATION */

if(
!project ||
!token ||
!symbol ||
!supply
){

showMessage(
"Please complete all required fields."
);

return;

}


if(Number(supply) <= 0){

showMessage(
"Total supply must be greater than 0."
);

return;

}


const allocationTotal =
calculateAllocation();


if(allocationTotal !== 100){

showMessage(
"Tokenomics allocation must equal exactly 100%."
);

return;

}


button.disabled = true;
button.textContent =
"Saving Project...";


/* USER */

const {
data:{
user
},
error:userError
} =
await supabase.auth.getUser();


if(userError || !user){

showMessage(
"You must login before creating a project."
);

button.disabled = false;
button.textContent =
"Generate & Save Project";

return;

}


/* TOKENOMICS */

const tokenomics = {

team:
Number(
document.getElementById("team").value
),

treasury:
Number(
document.getElementById("treasury").value
),

community:
Number(
document.getElementById("community").value
),

public_sale:
Number(
document.getElementById("sale").value
),

liquidity:
Number(
document.getElementById("liquidity").value
),

burn_reserve:
Number(
document.getElementById("burn").value
)

};


/*
Keep the existing database structure.

Tokenomics is stored inside description
so we don't need new Supabase columns yet.
*/

const finalDescription =

description +

"\n\n--- SONATIVA TOKENOMICS ---\n" +

"Team: " +
tokenomics.team + "%\n" +

"Treasury: " +
tokenomics.treasury + "%\n" +

"Community: " +
tokenomics.community + "%\n" +

"Public Sale: " +
tokenomics.public_sale + "%\n" +

"Liquidity: " +
tokenomics.liquidity + "%\n" +

"Burn Reserve: " +
tokenomics.burn_reserve + "%";


/* INSERT */

const {
data,
error
} =
await supabase

.from("projects")

.insert({

user_id:user.id,

project_name:project,

token_name:token,

token_symbol:symbol,

total_supply:Number(supply),

network:network,

description:finalDescription

})

.select()

.single();


/* ERROR */

if(error){

console.error(
"Project save error:",
error
);

showMessage(
"Could not save project: " +
error.message
);

button.disabled = false;

button.textContent =
"Generate & Save Project";

return;

}


/* SUCCESS */

console.log(
"Project saved:",
data
);


document.getElementById(
"rProject"
).innerHTML =
"<strong>Project:</strong> " +
escapeHTML(project);


document.getElementById(
"rToken"
).innerHTML =
"<strong>Token:</strong> " +
escapeHTML(token);


document.getElementById(
"rSymbol"
).innerHTML =
"<strong>Symbol:</strong> " +
escapeHTML(symbol);


document.getElementById(
"rSupply"
).innerHTML =
"<strong>Total Supply:</strong> " +
Number(supply).toLocaleString();


document.getElementById(
"rNetwork"
).innerHTML =
"<strong>Network:</strong> " +
escapeHTML(network);


document.getElementById(
"rTokenomics"
).innerHTML =

"<strong>Team:</strong> " +
tokenomics.team + "%<br>" +

"<strong>Treasury:</strong> " +
tokenomics.treasury + "%<br>" +

"<strong>Community:</strong> " +
tokenomics.community + "%<br>" +

"<strong>Public Sale:</strong> " +
tokenomics.public_sale + "%<br>" +

"<strong>Liquidity:</strong> " +
tokenomics.liquidity + "%<br>" +

"<strong>Burn Reserve:</strong> " +
tokenomics.burn_reserve + "%";


document.getElementById(
"result"
).style.display =
"block";


document.getElementById(
"message"
).style.display =
"none";


button.disabled = false;

button.textContent =
"Project Saved ✓";

};


/* =========================
CHECK LOGIN
========================= */

async function checkLogin(){

const {
data:{
user
}
} =
await supabase.auth.getUser();


if(!user){

showMessage(
"⚠️ You are not logged in. Please return to Sonativa and login first."
);

document.getElementById(
"generateButton"
).disabled = true;

}

}


/* =========================
AUTH
========================= */

supabase.auth.onAuthStateChange(
function(){

checkLogin();

}
);


/* INITIAL */

checkLogin();

</script>

</body>
</html>
