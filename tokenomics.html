<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tokenomics Studio — Sonativa</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(
circle at 50% -10%,
#172033 0%,
#06080d 45%,
#040509 100%
);
color:#fff;
min-height:100vh;
}

.container{
width:92%;
max-width:950px;
margin:auto;
}

header{
border-bottom:1px solid #202633;
background:rgba(5,7,12,.9);
}

.nav{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:23px;
font-weight:900;
letter-spacing:3px;
}

.back{
padding:10px 15px;
border:1px solid #303847;
border-radius:9px;
background:#10151e;
color:#fff;
text-decoration:none;
}

main{
padding:55px 0;
}

.hero{
text-align:center;
margin-bottom:35px;
}

.hero h1{
font-size:42px;
margin-bottom:10px;
}

.hero p{
color:#818b9c;
}

.project-box{
background:#0d1119;
border:1px solid #252d3b;
border-radius:15px;
padding:20px;
margin-bottom:20px;
}

.project-box span{
display:block;
color:#707b8e;
font-size:12px;
margin-bottom:5px;
}

.project-box strong{
font-size:20px;
}

.card{
background:rgba(12,16,23,.92);
border:1px solid #252d3b;
border-radius:16px;
padding:25px;
margin-bottom:20px;
}

.card h2{
font-size:20px;
margin-bottom:20px;
}

.row{
display:grid;
grid-template-columns:1fr 140px;
gap:12px;
align-items:center;
margin-bottom:14px;
}

label{
color:#aeb7c6;
font-size:14px;
}

input{
width:100%;
padding:13px;
background:#080b12;
border:1px solid #303847;
border-radius:9px;
color:#fff;
font-size:15px;
}

input:focus{
outline:none;
border-color:#697386;
}

.total{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
padding:18px;
background:#080b12;
border:1px solid #303847;
border-radius:10px;
}

.total strong{
font-size:20px;
}

.ok{
color:#8ee6b0;
}

.bad{
color:#ff8f8f;
}

.preview{
display:grid;
grid-template-columns:1fr;
gap:12px;
}

.preview-item{
padding:16px;
background:#080b12;
border:1px solid #252d3b;
border-radius:10px;
}

.preview-item span{
display:block;
color:#707b8e;
font-size:12px;
}

.preview-item strong{
font-size:18px;
word-break:break-word;
}

.message{
display:none;
padding:14px;
margin-bottom:20px;
border-radius:10px;
background:#10151e;
border:1px solid #303847;
color:#aeb7c6;
word-break:break-word;
}

.message.error{
color:#ff8f8f;
border-color:#633737;
}

.message.success{
color:#8ee6b0;
border-color:#315c45;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:9px;
background:#fff;
color:#06080d;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.success{
display:none;
margin-top:20px;
padding:20px;
border-radius:12px;
background:#080b12;
border:1px solid #303847;
}

.success h3{
margin-bottom:10px;
}

.success p{
color:#aeb7c6;
margin:5px 0;
}

.success a{
display:inline-block;
margin-top:15px;
color:#fff;
}

footer{
text-align:center;
padding:45px 0;
color:#697386;
font-size:13px;
}

@media(min-width:700px){

.preview{
grid-template-columns:repeat(3,1fr);
}

}

</style>

</head>

<body>

<header>

<div class="container nav">

<div class="logo">
SONATIVA
</div>

<a
class="back"
href="projects.html">

← My Projects

</a>

</div>

</header>


<main>

<div class="container">

<section class="hero">
